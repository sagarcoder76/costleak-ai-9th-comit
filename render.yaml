services:
  - type: web
    name: costleak-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: COSTLEAK_DB
        value: /tmp/costleak.db   # free tiers have an ephemeral/read-only project dir
